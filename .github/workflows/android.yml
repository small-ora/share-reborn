name: Build APK

# 触发：
#  1) 手动 Actions → Run workflow（可填版本标签）：只构建，产物在 Artifacts
#  2) push v* 标签：构建 + 自动创建 GitHub Release 并附 APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（可选，例如 v0.1.0；留空只构建 artifact）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle*', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 解码签名证书
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，将产出未签名/调试签名的 APK（无法覆盖升级）"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          ls -l keystore/release.jks

      - name: 构建 Release APK
        env:
          KEYSTORE_PATH: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }}

      - name: 门禁：校验签名与 versionCode
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          [ -d "$BT" ] || BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          if [ -f keystore/release.jks ]; then
            CERTS="$("$BT/apksigner" verify --print-certs "$APK")"
            echo "$CERTS" | head -5
            ACTUAL=$(echo "$CERTS" | grep -i "SHA-256" | head -1 | grep -oE '[0-9a-fA-F]{64}' | head -1 | tr 'A-Z' 'a-z')
            EXPECTED=$(tr -d ':' < .github/expected-cert-sha256.txt | tr 'A-Z' 'a-z')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "❌ 签名证书与预期不一致（覆盖升级会失败）"
              echo "  expected: $EXPECTED"
              echo "  actual  : $ACTUAL"
              exit 1
            fi
            echo "✅ 签名证书与预期一致"
          else
            echo "⚠️ 未配置签名，跳过证书校验（产物不可覆盖升级）"
          fi

          BADGING="$("$BT/aapt" dump badging "$APK" | head -1)"
          echo "$BADGING"
          if ! echo "$BADGING" | grep -q "versionCode='${{ github.run_number }}'"; then
            echo "❌ versionCode 不是预期的 ${{ github.run_number }}"
            exit 1
          fi
          echo "✅ versionCode 正确"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: share-reborn-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 创建 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: |
            Share Reborn 自动构建（游客模式骨架）。

            - 签名固定，可直接覆盖升级
            - versionCode: ${{ github.run_number }}
